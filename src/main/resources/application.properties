spring.application.name=househost
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${HOUSEHOST_DB_URL:jdbc:mysql://localhost:3306/househost?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${HOUSEHOST_DB_USERNAME:root}
spring.datasource.password=${HOUSEHOST_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

househost.login-protection.pair.max-failures=${HOUSEHOST_LOGIN_PAIR_MAX_FAILURES:10}
househost.login-protection.pair.window=${HOUSEHOST_LOGIN_PAIR_WINDOW:5m}
househost.login-protection.pair.block=${HOUSEHOST_LOGIN_PAIR_BLOCK:15m}
househost.login-protection.ip.max-failures=${HOUSEHOST_LOGIN_IP_MAX_FAILURES:30}
househost.login-protection.ip.window=${HOUSEHOST_LOGIN_IP_WINDOW:5m}
househost.login-protection.ip.block=${HOUSEHOST_LOGIN_IP_BLOCK:30m}
househost.login-protection.account.max-failures=${HOUSEHOST_LOGIN_ACCOUNT_MAX_FAILURES:20}
househost.login-protection.account.window=${HOUSEHOST_LOGIN_ACCOUNT_WINDOW:10m}
househost.login-protection.account.block=${HOUSEHOST_LOGIN_ACCOUNT_BLOCK:15m}
househost.login-protection.retention=${HOUSEHOST_LOGIN_LIMIT_RETENTION:30d}
househost.login-protection.hmac-secret=${HOUSEHOST_LOGIN_LIMIT_HMAC_SECRET}
househost.login-protection.trusted-proxies=${HOUSEHOST_LOGIN_TRUSTED_PROXIES:}
househost.login-protection.alert-destination=${HOUSEHOST_LOGIN_SECURITY_ALERT_DESTINATION:operations-security-log}
