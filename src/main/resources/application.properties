spring.application.name=househost
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${HOUSEHOST_DB_URL:jdbc:mysql://localhost:3306/househost?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${HOUSEHOST_DB_USERNAME:root}
spring.datasource.password=${HOUSEHOST_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.forward-headers-strategy=framework

househost.logging.path=${HOUSEHOST_LOG_PATH:./logs}
househost.logging.environment=${HOUSEHOST_ENVIRONMENT:development}
househost.logging.max-file-size=${HOUSEHOST_LOG_MAX_FILE_SIZE:20MB}
househost.logging.max-history=${HOUSEHOST_LOG_MAX_HISTORY:30}
househost.logging.general-total-size-cap=${HOUSEHOST_LOG_GENERAL_TOTAL_SIZE_CAP:1536MB}
househost.logging.error-total-size-cap=${HOUSEHOST_LOG_ERROR_TOTAL_SIZE_CAP:512MB}
logging.level.root=${HOUSEHOST_ROOT_LOG_LEVEL:INFO}
logging.level.com.househost=${HOUSEHOST_LOG_LEVEL:INFO}

# Single-instance bounded limiter. A multi-instance deployment requires a shared limiter.
househost.client-logging.rate-limit.actor-max=${HOUSEHOST_CLIENT_LOG_ACTOR_MAX:60}
househost.client-logging.rate-limit.origin-max=${HOUSEHOST_CLIENT_LOG_ORIGIN_MAX:120}
househost.client-logging.rate-limit.max-keys=${HOUSEHOST_CLIENT_LOG_MAX_KEYS:2000}
househost.client-logging.rate-limit.window=${HOUSEHOST_CLIENT_LOG_WINDOW:PT1M}

househost.login-protection.pair.max-failures=${HOUSEHOST_LOGIN_PAIR_MAX_FAILURES:10}
househost.login-protection.pair.window=${HOUSEHOST_LOGIN_PAIR_WINDOW:5m}
househost.login-protection.pair.block=${HOUSEHOST_LOGIN_PAIR_BLOCK:15m}
househost.login-protection.ip.max-failures=${HOUSEHOST_LOGIN_IP_MAX_FAILURES:30}
househost.login-protection.ip.window=${HOUSEHOST_LOGIN_IP_WINDOW:5m}
househost.login-protection.ip.block=${HOUSEHOST_LOGIN_IP_BLOCK:30m}
househost.login-protection.account.max-failures=${HOUSEHOST_LOGIN_ACCOUNT_MAX_FAILURES:20}
househost.login-protection.account.window=${HOUSEHOST_LOGIN_ACCOUNT_WINDOW:10m}
househost.login-protection.account.block=${HOUSEHOST_LOGIN_ACCOUNT_BLOCK:15m}
househost.login-protection.retention=${HOUSEHOST_LOGIN_LIMIT_RETENTION:30d}
househost.login-protection.hmac-secret=${HOUSEHOST_LOGIN_LIMIT_HMAC_SECRET}
househost.login-protection.trusted-proxies=${HOUSEHOST_LOGIN_TRUSTED_PROXIES:}
househost.login-protection.alert-destination=${HOUSEHOST_LOGIN_SECURITY_ALERT_DESTINATION:operations-security-log}

househost.notifier.dispatch-enabled=${HOUSEHOST_NOTIFIER_DISPATCH_ENABLED:false}
househost.notifier.initial-delay-ms=${HOUSEHOST_NOTIFIER_INITIAL_DELAY_MS:15000}
househost.notifier.dispatch-delay-ms=${HOUSEHOST_NOTIFIER_DISPATCH_DELAY_MS:10000}
househost.notifier.batch-size=${HOUSEHOST_NOTIFIER_BATCH_SIZE:20}
househost.notifier.lease-duration=${HOUSEHOST_NOTIFIER_LEASE_DURATION:2m}
househost.notifier.maximum-attempts=${HOUSEHOST_NOTIFIER_MAXIMUM_ATTEMPTS:5}
househost.notifier.retry-initial-delay=${HOUSEHOST_NOTIFIER_RETRY_INITIAL_DELAY:30s}
househost.notifier.retry-maximum-delay=${HOUSEHOST_NOTIFIER_RETRY_MAXIMUM_DELAY:10m}
househost.notifier.retry-jitter-ratio=${HOUSEHOST_NOTIFIER_RETRY_JITTER_RATIO:0.20}
househost.notifier.content-retention=${HOUSEHOST_NOTIFIER_CONTENT_RETENTION:30d}

househost.public-booking.notification.enabled=${HOUSEHOST_PUBLIC_BOOKING_NOTIFICATION_ENABLED:false}
househost.public-booking.notification.management-recipient=${HOUSEHOST_PUBLIC_BOOKING_MANAGEMENT_RECIPIENT:}
househost.public-booking.notification.delivery-profile-key=${HOUSEHOST_PUBLIC_BOOKING_DELIVERY_PROFILE_KEY:HOUSEHOST_TRANSACTIONAL}

househost.notifier.ses.enabled=${HOUSEHOST_NOTIFIER_SES_ENABLED:false}
househost.notifier.ses.api-call-timeout=${HOUSEHOST_NOTIFIER_SES_API_CALL_TIMEOUT:10s}
househost.notifier.ses.api-call-attempt-timeout=${HOUSEHOST_NOTIFIER_SES_API_CALL_ATTEMPT_TIMEOUT:5s}
househost.notifier.ses.profiles.househost-transactional.enabled=${HOUSEHOST_NOTIFIER_HOUSEHOST_TRANSACTIONAL_ENABLED:false}
househost.notifier.ses.profiles.househost-transactional.region=${HOUSEHOST_NOTIFIER_HOUSEHOST_TRANSACTIONAL_REGION:}
househost.notifier.ses.profiles.househost-transactional.sender=${HOUSEHOST_NOTIFIER_HOUSEHOST_TRANSACTIONAL_SENDER:}
househost.notifier.ses.profiles.househost-transactional.reply-to=${HOUSEHOST_NOTIFIER_HOUSEHOST_TRANSACTIONAL_REPLY_TO:}
househost.notifier.ses.profiles.househost-transactional.configuration-set=${HOUSEHOST_NOTIFIER_HOUSEHOST_TRANSACTIONAL_CONFIGURATION_SET:}
househost.notifier.ses.profiles.househost-transactional.permitted-source-systems=${HOUSEHOST_NOTIFIER_HOUSEHOST_TRANSACTIONAL_SOURCE_SYSTEMS:}

househost.notifier.sns.enabled=${HOUSEHOST_NOTIFIER_SNS_ENABLED:false}
househost.notifier.sns.topic-arn=${HOUSEHOST_NOTIFIER_SNS_TOPIC_ARN:}
househost.notifier.sns.region=${HOUSEHOST_NOTIFIER_SNS_REGION:}
househost.notifier.sns.require-https=${HOUSEHOST_NOTIFIER_SNS_REQUIRE_HTTPS:true}
househost.notifier.sns.max-request-size=${HOUSEHOST_NOTIFIER_SNS_MAX_REQUEST_SIZE:64KB}
househost.notifier.sns.subscription-confirmation-enabled=${HOUSEHOST_NOTIFIER_SNS_SUBSCRIPTION_CONFIRMATION_ENABLED:false}
househost.notifier.sns.subscription-confirmation-timeout=${HOUSEHOST_NOTIFIER_SNS_SUBSCRIPTION_CONFIRMATION_TIMEOUT:5s}
